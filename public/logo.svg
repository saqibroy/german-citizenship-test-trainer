<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Circle Background -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)"/>
  
  <!-- German Flag Colors (top accent) -->
  <path d="M 100 150 L 412 150 L 412 180 L 100 180 Z" fill="#000000" opacity="0.3"/>
  <path d="M 100 180 L 412 180 L 412 210 L 100 210 Z" fill="#DD0000" opacity="0.3"/>
  <path d="M 100 210 L 412 210 L 412 240 L 100 240 Z" fill="#FFCE00" opacity="0.3"/>
  
  <!-- Graduation Cap (Main Icon) -->
  <g transform="translate(256, 300)">
    <!-- Cap Base -->
    <path d="M -140 -30 L 0 -80 L 140 -30 L 140 30 L -140 30 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Cap Top -->
    <ellipse cx="0" cy="-30" rx="140" ry="32" fill="#ffffff"/>
    <!-- Tassel -->
    <circle cx="70" cy="-95" r="12" fill="#fbbf24"/>
    <line x1="70" y1="-83" x2="70" y2="-40" stroke="#fbbf24" stroke-width="6"/>
  </g>
  
  <!-- Checkmark (Success Symbol) -->
  <path d="M 370 170 L 395 195 L 450 140" stroke="#22c55e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  
  <!-- Book Pages (Knowledge Symbol) -->
  <g transform="translate(75, 170)">
    <rect x="0" y="0" width="70" height="95" rx="5" fill="#ffffff" opacity="0.2"/>
    <line x1="15" y1="25" x2="55" y2="25" stroke="#ffffff" stroke-width="4" opacity="0.6"/>
    <line x1="15" y1="45" x2="55" y2="45" stroke="#ffffff" stroke-width="4" opacity="0.6"/>
    <line x1="15" y1="65" x2="55" y2="65" stroke="#ffffff" stroke-width="4" opacity="0.6"/>
  </g>
</svg>
